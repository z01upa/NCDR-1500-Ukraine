[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncdr-map-research"
version = "0.1.0"
description = "Read-only NCDR binary research and bounded local worker tools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ncdr-qwen = "ncdqwen.runner:main"

[tool.setuptools]
packages = ["ncdqwen"]
